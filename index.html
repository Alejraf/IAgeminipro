<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Studio AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-box { max-height: 55vh; overflow-y: auto; scroll-behavior: smooth; }
    </style>
    <!-- SDK oficial modular de Google Gen AI -->
    <script type="importmap">
    {
        "imports": {
            "@google/genai": "https://esm.sh/@google/genai"
        }
    }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100 font-sans">

    <!-- Cabecera -->
    <header class="flex justify-between items-center px-4 py-3 bg-slate-900 border-b border-slate-800">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <h1 class="font-bold text-lg tracking-wide text-white">Gemini Studio AI</h1>
        </div>
        <div class="flex items-center space-x-2">
            <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full border border-slate-700">gemini-2.5-flash</span>
        </div>
    </header>

    <!-- Bloque Publicitario Superior (AdSense) -->
    <div class="mx-4 my-3 p-3 bg-slate-900/60 border border-slate-800/80 rounded-xl text-center">
        <p class="text-[10px] uppercase tracking-wider text-slate-500 mb-1 font-semibold">Publicidad Patrocinada</p>
        <div class="h-12 flex items-center justify-center text-xs text-slate-500 bg-slate-950/40 rounded border border-dashed border-slate-800">
            Banner Adaptable AdSense (728x90)
        </div>
    </div>

    <!-- Contenedor Principal del Chat -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-2 flex flex-col justify-end">
        <div id="chat-box" class="chat-box space-y-4 pr-1 mb-4">
            <!-- Mensaje de bienvenida inicial -->
            <div class="flex items-start space-x-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-xs shrink-0 shadow-lg">IA</div>
                <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl rounded-tl-sm text-sm text-slate-200 max-w-[85%] shadow-sm leading-relaxed">
                    ¡Hola! Soy tu asistente de Gemini. ¿En qué puedo ayudarte hoy?
                </div>
            </div>
        </div>
    </main>

    <!-- Bloque Publicitario Inferior (In-Feed) -->
    <div class="max-w-4xl w-full mx-auto px-4 mb-2">
        <div class="p-2 bg-slate-900/40 border border-slate-800/60 rounded-lg text-center">
            <p class="text-[9px] uppercase tracking-wider text-slate-600">Anuncio Patrocinado</p>
            <div class="h-8 flex items-center justify-center text-[11px] text-slate-600">Banner Horizontal In-Feed</div>
        </div>
    </div>

    <!-- Barra de Entrada y Micrófono -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3">
        <div class="max-w-4xl mx-auto flex items-center space-x-2">
            <input type="text" id="user-input" placeholder="Envía un mensaje o usa el micrófono..." 
                class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
            
            <!-- Botón de Micrófono -->
            <button id="mic-btn" type="button" class="p-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition-colors flex items-center justify-center" title="Usar voz">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </button>

            <!-- Botón de Enviar -->
            <button id="send-btn" type="button" class="p-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition-colors shadow-lg shadow-indigo-600/20 flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                </svg>
            </button>
        </div>
    </footer>

    <!-- Lógica de la Aplicación con el SDK Oficial -->
    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        // Inicialización con tu clave legítima de AI Studio
        const ai = new GoogleGenAI({ apiKey: "AIzaSyDfyhHUFMg_O5Z3cAunp6gxcg9hNJc7Dfs" });

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');

        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full ${isUser ? 'bg-indigo-600' : 'bg-gradient-to-tr from-indigo-600 to-violet-500'} flex items-center justify-center text-white font-bold text-xs shrink-0 shadow-lg">
                    ${isUser ? 'TÚ' : 'IA'}
                </div>
                <div class="${isUser ? 'bg-indigo-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'} p-3.5 rounded-2xl ${isUser ? 'rounded-tr-sm' : 'rounded-tl-sm'} text-sm max-w-[85%] shadow-sm leading-relaxed">
                    ${text}
                </div>
            `;
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            // Indicador de carga temporal
            const loadingId = 'loading-' + Date.now();
            const loadingWrapper = document.createElement('div');
            loadingWrapper.id = loadingId;
            loadingWrapper.className = `flex items-start space-x-3`;
            loadingWrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-xs shrink-0 shadow-lg">IA</div>
                <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl rounded-tl-sm text-sm text-slate-400 max-w-[85%] animate-pulse">
                    Pensando...
                </div>
            `;
            chatBox.appendChild(loadingWrapper);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Llamada oficial al modelo gemini-2.5-flash usando el SDK modular
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: text,
                });

                // Remover indicador de carga
                document.getElementById(loadingId)?.remove();

                const aiResponse = response.text || "No se obtuvo respuesta del modelo.";
                appendMessage('ai', aiResponse);

            } catch (error) {
                document.getElementById(loadingId)?.remove();
                console.error("Error de conexión:", error);
                appendMessage('ai', `<span class="text-rose-400">Error de conexión: ${error.message || error}</span>`);
            }
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });

        // Configuración de Reconocimiento de Voz Nativo (Micrófono)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                micBtn.classList.add('bg-indigo-600', 'text-white');
                recognition.start();
            });

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                userInput.value = speechToText;
                micBtn.classList.remove('bg-indigo-600', 'text-white');
                handleSendMessage();
            };

            recognition.onerror = () => {
                micBtn.classList.remove('bg-indigo-600', 'text-white');
            };

            recognition.onend = () => {
                micBtn.classList.remove('bg-indigo-600', 'text-white');
            };
        } else {
            micBtn.style.display = 'none';
        }
    </script>
</body>
</html>
