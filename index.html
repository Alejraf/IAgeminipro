<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilitário de Links & Mídia Rápida</title>
    <meta name="monetag" content="f63bb788de86359b5461966e9948b11f">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-align: center;
            color: var(--text-main);
        }
        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--accent);
        }
        button {
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #resultArea {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border-radius: 8px;
            display: none;
            word-break: break-all;
            font-size: 0.9rem;
            border-left: 4px solid var(--accent);
        }
        /* Espacio reservado para los anuncios de Monetag */
        .ad-container {
            margin: 20px 0;
            text-align: center;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }
        footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 10px;
        }
    </style>

    <!-- PEGA AQUÍ TU SCRIPT DE MONETAG CUANDO TE LO PROPORCIONEN -->
    <!-- Ejemplo: <script src="https://alwingulla.com/tag.min.js" data-zone="TU_ZONA" async></script> -->
</head>
<body>

    <div class="container">
        <h1>Utilitário de Mídia Web</h1>
        <p class="subtitle">Cole o link público para processar e gerar recursos limpos instantaneamente.</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Cole seu link aqui (ex: https://...)">
            <button onclick="processLink()">Processar Link</button>
        </div>

        <div id="resultArea"></div>

        <!-- Espacio publicitario integrado -->
        <div class="ad-container" id="adSlot">
            <span style="color: var(--text-muted); font-size: 0.75rem;">Espaço publicitário</span>
        </div>
    </div>

    <footer>
        &copy; 2026 Utilitários Web. Todos os direitos reservados.
    </footer>

    <script>
        function processLink() {
            const url = document.getElementById('urlInput').value.trim();
            const resultArea = document.getElementById('resultArea');

            if (!url) {
                alert('Por favor, insira um link válido.');
                return;
            }

            // Simulación de procesamiento rápido y eficiente en el cliente
            resultArea.style.display = 'block';
            resultArea.innerHTML = `<strong>Processando:</strong> ${url}<br><br><span style="color: #38bdf8;">✓ Link limpo e otimizado com sucesso! Pronto para uso.</span>`;
        }
    </script>
</body>
</html>
