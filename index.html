<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Studio AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-4xl mx-auto">

    <!-- Cabecera -->
    <header class="flex justify-between items-center py-3 border-b border-slate-800">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 bg-emerald-500 rounded-full inline-block animate-pulse"></span>
            <h1 class="font-bold text-lg tracking-wide">Gemini Studio AI</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button class="bg-slate-800 text-xs px-3 py-1.5 rounded-lg border border-slate-700 font-medium">API Key Configurada</button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 my-6 flex flex-col justify-center">
        <div class="text-center mb-8">
            <h2 class="text-2xl sm:text-3xl font-bold mb-2">¿En qué puedo ayudarte hoy?</h2>
            <p class="text-slate-400 text-sm">Selecciona una sugerencia o escribe un mensaje para comenzar.</p>
        </div>

        <!-- Sugerencias -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
            <div onclick="document.getElementById('user-input').value='Crear un servidor HTTP simple en Python con soporte JSON.'" class="bg-slate-800 border border-slate-700 rounded-xl p-4 cursor-pointer hover:border-blue-500 transition">
                <span class="text-xs font-semibold text-blue-400 uppercase block mb-1">Código Python</span>
                <p class="text-sm text-slate-300">Crear un servidor HTTP simple en Python con soporte JSON.</p>
            </div>
            <div onclick="document.getElementById('user-input').value='Explicación simple sobre cómo funciona la transmisión y aceleración en una moto.'" class="bg-slate-800 border border-slate-700 rounded-xl p-4 cursor-pointer hover:border-emerald-500 transition">
                <span class="text-xs font-semibold text-emerald-400 uppercase block mb-1">Mecánica Práctica</span>
                <p class="text-sm text-slate-300">Explicación simple sobre cómo funciona la transmisión y aceleración en una moto.</p>
            </div>
        </div>
    </main>

    <!-- Barra de Entrada -->
    <footer class="mt-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-2 flex items-center shadow-lg">
            <input type="text" id="user-input" placeholder="Envía un mensaje..." class="bg-transparent flex-1 px-3 text-sm text-slate-200 focus:outline-none placeholder-slate-500">
            <div class="flex items-center space-x-2 ml-2">
                <button type="button" class="p-2 text-blue-400">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path></svg>
                </button>
                <button type="button" class="bg-blue-600 text-white p-2 rounded-full">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </footer>

</body>
</html>
